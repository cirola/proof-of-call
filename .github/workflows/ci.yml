name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: the only run whose result
# matters is the one for the current head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: it installs from the lockfile exactly and
      # fails if package.json and the lockfile disagree, which is the difference
      # between CI verifying the dependency set and CI quietly changing it.
      # forge-std is a git dependency, so the runner's git is doing real work here.
      - run: npm ci

      - name: Compile
        run: npm run build

      - name: Lint contracts
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Split from the Solidity tests so a failure names which runner broke.
      - name: TypeScript tests
        run: npm run test:nodejs

      - name: Solidity fuzz tests
        run: npm run test:solidity

      - name: Coverage
        run: npm run coverage

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci

      # The frontend imports ABIs from a generated, committed file. Compiling the
      # contracts and re-running the generator here is what turns "the committed
      # copy drifted from the contracts" from a runtime decode error into a red
      # build.
      - name: Compile contracts
        run: npm run build

      - name: Check the committed ABIs match the contracts
        run: npm run export-abi:check

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # `npm run build` in the frontend runs `tsc --noEmit` before vite, so a
      # type error fails here rather than shipping.
      - name: Type-check and build the frontend
        run: npm run build --prefix frontend
